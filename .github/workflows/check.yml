name: Check redirect worker
on: [pull_request, push]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.1.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec biome check src
      - run: pnpm exec wrangler types --env-interface CloudflareBindings --check
      - run: pnpm deploy:dry-run
      - run: pnpm exec wrangler deploy --env dev --dry-run
    env:
      WRANGLER_SEND_METRICS: 'false'
