name: Check redirect worker
on: [pull_request, push]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:runtime
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm exec wrangler types --env-interface CloudflareBindings --check
      - run: pnpm deploy:dry-run
      - run: pnpm exec wrangler deploy --env dev --dry-run
    env:
      WRANGLER_SEND_METRICS: "false"
